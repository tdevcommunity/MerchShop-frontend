version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    groups:
      npm-production:
        dependency-type: production
        update-types: [minor, patch]
      npm-assets:
        patterns:
          - "*"
      github-actions:
        patterns:
          - "*"
    # Mettre à jour la branche develop
    commit-updates:
      branch: develop
    # Ouvrir les PRs sur la branche develop
    open-pull-requests-branch: develop