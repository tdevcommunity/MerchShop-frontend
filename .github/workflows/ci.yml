# Integration continue (frontend) : tourne sur chaque PR et sur develop.
# Les jobs sont bloquants : si l'un echoue, la PR ne peut pas etre merge.
name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dependances
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Linter
        run: npm run lint

  typecheck:
    name: TypeCheck (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dependances
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verifier les types
        run: npm run typecheck

  test:
    name: Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dependances
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Lancer les tests
        run: npm test

  build:
    name: Build (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dependances
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build
        run: npm run build