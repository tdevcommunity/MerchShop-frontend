# Detection des vulnerabilites du frontend.
#
# Jobs :
#  - npm-audit          : audite les dependances (bloque sur toute vulnerabilite) ;
#  - codeql             : analyse statique du code TypeScript/JavaScript ;
#  - trivy-fs           : secrets, erreurs de configuration, dependances (SARIF) ;
#  - trivy-image        : vulnerabilites de l'image Docker de production.
#                         Le rapport couvre toutes les severites, mais seules
#                         les failles HIGH/CRITICAL *corrigeables* bloquent.
#
# Les resultats SARIF remontent dans l'onglet Security > Code scanning.
# Aucune correction automatique : quand une vulnerabilite est detectee, le job
# echoue et la liste des paquets concernes apparait dans le resume du job. La
# correction et le commit restent manuels.
# Les simples mises a jour de version sont listees par le workflow Dependencies.

name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dependances
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Auditer les dependances
        run: |
          set +e
          npm audit --json > npm-audit.json
          status=$?
          set -e
          node .github/scripts/npm-audit-summary.mjs npm-audit.json
          if [ "$status" -ne 0 ] && [ ! -s npm-audit.json ]; then
            echo "::error::npm audit n'a pas pu produire de rapport."
            exit "$status"
          fi

  codeql:
    name: CodeQL (JavaScript/TypeScript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Initialiser CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analyser le code
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript

  trivy-fs:
    name: Trivy (fichiers, secrets, config)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Scan SARIF (bloquant)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-fs.sarif
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"

      - name: Scan lisible
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: table
          output: trivy-fs.txt
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"

      - name: Ajouter le rapport au resume du job
        if: always() && hashFiles('trivy-fs.txt') != ''
        run: |
          {
            echo "### Trivy - dependances, secrets et configuration"
            echo '```'
            cat trivy-fs.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publier le rapport dans Code scanning
        if: always() && hashFiles('trivy-fs.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  trivy-image:
    name: Trivy (image Docker)
    # Pas de build d'image sur les PR : le workflow Deploy la construit deja
    # au merge. Le scan tourne sur main/develop, chaque semaine et a la demande.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Construire l'image de production
        run: docker build -t merchshop-frontend:scan .

      # Rapport complet, sans blocage : toutes les severites remontent dans
      # Security > Code scanning, y compris celles que Debian n'a pas encore
      # corrigees et qui ne peuvent donc pas etre traitees ici.
      - name: Scan SARIF (informatif)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: merchshop-frontend:scan
          format: sarif
          output: trivy-image.sarif
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"

      - name: Scan lisible
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: merchshop-frontend:scan
          format: table
          output: trivy-image.txt
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"

      # Seul blocage : une faille HIGH/CRITICAL pour laquelle un correctif
      # existe. Une CVE sans version corrigee ne peut pas etre traitee par une
      # mise a jour, elle ne doit donc pas rendre le job rouge.
      - name: Gate bloquant (HIGH/CRITICAL corrigeables)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: merchshop-frontend:scan
          format: table
          output: trivy-image-gate.txt
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Ajouter le rapport au resume du job
        if: always() && hashFiles('trivy-image.txt') != ''
        run: |
          {
            echo "### Trivy - image Docker"
            echo
            echo "Rapport complet (toutes severites, non bloquant) :"
            echo '```'
            cat trivy-image.txt
            echo '```'
            if [ -s trivy-image-gate.txt ]; then
              echo
              echo "Gate bloquant - HIGH/CRITICAL avec correctif :"
              echo '```'
              cat trivy-image-gate.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publier le rapport dans Code scanning
        if: always() && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
